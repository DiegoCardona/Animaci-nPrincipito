<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Principito, Página Uno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;900&family=Nunito:wght@800;900&display=swap">
<style>
  /* Layout: una sola escena a pantalla completa (lienzo 16:9 centrado) con controles flotantes abajo. */
  :root {
    --night: #120a26;      /* fondo del marco, mismo tono que la tinta */
    --ink: #1b1033;        /* contorno de todas las facetas */
    --paper: #fbf1d6;      /* papel de los paneles */
    --gold: #ffc93c;       /* acento: títulos y foco */
    --rose: #e0307a;       /* palabras destacadas */
    --hud: rgba(27, 16, 51, .82);
    --font-display: "Grandstander", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--paper);
    font-family: var(--font-body);
    overflow: hidden;
  }
  .stage {
    position: relative;
    height: 100%;
    width: 100%;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }
  .hud {
    position: absolute;
    left: 50%;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    width: min(720px, calc(100% - 32px));
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--hud);
    border: 3px solid var(--ink);
    border-radius: 6px;
    box-shadow: 0 6px 0 var(--ink);
    transition: opacity .4s ease, transform .4s ease;
    font-variant-numeric: tabular-nums;
  }
  .hud.idle { opacity: 0; transform: translate(-50%, 10px); pointer-events: none; }
  .hud button {
    flex: none;
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    background: var(--gold);
    color: var(--ink);
    border: 3px solid var(--ink);
    border-radius: 4px;
    cursor: pointer;
    clip-path: polygon(6% 0, 100% 4%, 96% 100%, 0 94%);
  }
  .hud button:focus-visible, .hud input:focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }
  .hud button svg { width: 20px; height: 20px; }
  .hud input[type="range"] { flex: 1; min-width: 0; accent-color: var(--gold); }
  .hud .time { flex: none; font-weight: 800; font-size: 14px; color: var(--paper); }
  @media (max-width: 480px) { .hud .time { display: none; } }
</style>
</head>
<body>
<div class="stage" id="stageWrap">
  <canvas id="stage" role="img" aria-label="Animación en dos dimensiones, estilo low poly, de la primera página de El Principito"></canvas>
  <div class="hud" id="hud">
    <button id="play" type="button" aria-label="Pausar">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path id="playIcon" d="M5 3h4v14H5zM11 3h4v14h-4z" fill="currentColor"/></svg>
    </button>
    <button id="restart" type="button" aria-label="Volver a empezar">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a7 7 0 1 1-6.6 4.7l2 .7A5 5 0 1 0 10 5v3L5 4l5-4z" fill="currentColor"/></svg>
    </button>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posición de la animación">
    <span class="time" id="time">0:00</span>
  </div>
</div>
<script>
(() => {
'use strict';

/* ================================================================
   Utilidades
   ================================================================ */
const W = 1920, H = 1080;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const INK = '#1b1033';
let DIM = 0; // oscurecimiento global (noche)

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => (t = clamp(t), t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeIn = t => Math.pow(clamp(t), 3);
const easeBack = t => { t = clamp(t); const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const sstep = (a, b, t) => { t = clamp((t - a) / (b - a)); return t * t * (3 - 2 * t); };
const hash = n => { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const hsl = (c, dl = 0) => `hsl(${c[0].toFixed(1)},${clamp(c[1], 0, 100).toFixed(1)}%,${(clamp(c[2] + dl, 0, 100) * (1 - DIM)).toFixed(1)}%)`;

/* ================================================================
   Primitivas low poly
   ================================================================ */
const LX = -0.55, LY = -0.83; // luz desde arriba a la izquierda

function tri(a, b, c, fill, lw) {
  ctx.beginPath();
  ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  if (lw) { ctx.lineWidth = lw; ctx.stroke(); }
}
function outline(pts, lw, ink) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.lineWidth = lw; ctx.strokeStyle = ink || INK; ctx.lineJoin = 'round';
  ctx.stroke();
}
function shadeFor(mx, my, cx, cy, i, seed, con) {
  let dx = mx - cx, dy = my - cy; const d = Math.hypot(dx, dy) || 1;
  dx /= d; dy /= d;
  return (dx * LX + dy * LY) * con + (hash(i * 7.13 + seed) - .5) * con * .8;
}
/* Polígono facetado: anillo exterior + abanico interior, bordes de tinta. */
function facet(pts, col, o = {}) {
  const lw = o.lw ?? 5, seed = o.seed ?? 1, con = o.contrast ?? 9;
  const ilw = o.ilw ?? Math.max(1, lw * .38);
  let cx = 0, cy = 0;
  for (const p of pts) { cx += p[0]; cy += p[1]; }
  cx = cx / pts.length + (o.ox || 0); cy = cy / pts.length + (o.oy || 0);
  ctx.strokeStyle = o.iink || o.ink || INK; ctx.lineJoin = 'round';
  const n = pts.length, C = [cx, cy];
  let k = 0;
  if (o.simple) {
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      tri(a, b, C, hsl(col, shadeFor((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, cx, cy, k++, seed, con)), ilw);
    }
  } else {
    const inner = pts.map((p, i) => {
      const s = .52 + (hash(i * 1.37 + seed * 3.1) - .5) * .18;
      return [cx + (p[0] - cx) * s, cy + (p[1] - cy) * s];
    });
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n, a = pts[i], b = pts[j], c = inner[j], d = inner[i];
      tri(a, b, c, hsl(col, shadeFor((a[0] + b[0] + c[0]) / 3, (a[1] + b[1] + c[1]) / 3, cx, cy, k++, seed, con)), ilw);
      tri(a, c, d, hsl(col, shadeFor((a[0] + c[0] + d[0]) / 3, (a[1] + c[1] + d[1]) / 3, cx, cy, k++, seed, con) + 1.5), ilw);
      tri(d, c, C, hsl(col, shadeFor((c[0] + d[0] + cx) / 3, (c[1] + d[1] + cy) / 3, cx, cy, k++, seed, con) * .6 + 3), ilw);
    }
  }
  if (lw) outline(pts, lw, o.ink);
}
/* Franja facetada entre dos polilíneas (cuerpos, troncos, colinas). */
function strip(top, bot, col, o = {}) {
  const rows = o.rows ?? 2, lw = o.lw ?? 5, seed = o.seed ?? 2, con = o.contrast ?? 10;
  const ilw = o.ilw ?? Math.max(1, lw * .38);
  const n = top.length, g = [];
  for (let r = 0; r <= rows; r++) {
    g.push(top.map((p, i) => {
      const b = bot[i];
      let t = r / rows;
      if (r > 0 && r < rows) t += (hash(i * 3.7 + r * 11 + seed) - .5) * .5 / rows;
      return [lerp(p[0], b[0], t), lerp(p[1], b[1], t)];
    }));
  }
  ctx.strokeStyle = o.iink || o.ink || INK; ctx.lineJoin = 'round';
  let k = 0;
  for (let r = 0; r < rows; r++) {
    const base = (.5 - (r + .5) / rows) * con * 1.2;
    for (let i = 0; i < n - 1; i++) {
      const c1 = o.colFn ? o.colFn(i, r) : col;
      const a = g[r][i], b = g[r][i + 1], c = g[r + 1][i + 1], d = g[r + 1][i];
      const v1 = base + (hash(k++ * 1.7 + seed) - .5) * con, v2 = base + (hash(k++ * 1.7 + seed) - .5) * con - 2;
      if ((i + r) % 2) { tri(a, b, c, hsl(c1, v1), ilw); tri(a, c, d, hsl(c1, v2), ilw); }
      else { tri(a, b, d, hsl(c1, v1), ilw); tri(b, c, d, hsl(c1, v2), ilw); }
    }
  }
  if (lw) outline([...top, ...bot.slice().reverse()], lw, o.ink);
}
function ribbon(spine, wfn) {
  const top = [], bot = [], n = spine.length;
  for (let i = 0; i < n; i++) {
    const p = spine[i], a = spine[Math.max(0, i - 1)], b = spine[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const d = Math.hypot(tx, ty) || 1;
    tx /= d; ty /= d;
    const w = wfn(i / (n - 1)) / 2;
    top.push([p[0] + ty * w, p[1] - tx * w]);
    bot.push([p[0] - ty * w, p[1] + tx * w]);
  }
  return { top, bot };
}
function blob(cx, cy, rx, ry, n, seed, jit = .1, rot = 0) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = rot + i / n * Math.PI * 2, r = 1 + (hash(seed * 13.1 + i * 1.7) - .5) * 2 * jit;
    pts.push([cx + Math.cos(a) * rx * r, cy + Math.sin(a) * ry * r]);
  }
  return pts;
}
const rectP = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
function dot(x, y, r, fill) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = fill; ctx.fill();
}

/* Fondo: malla triangular irregular que cubre el lienzo */
const BG = (() => {
  const cols = 16, rows = 10, P = [];
  for (let j = 0; j <= rows; j++) {
    const row = [];
    for (let i = 0; i <= cols; i++) {
      let x = i / cols * W, y = j / rows * H;
      if (i > 0 && i < cols) x += (hash(i * 13 + j * 7) - .5) * W / cols * .75;
      if (j > 0 && j < rows) y += (hash(i * 5 + j * 17 + 3) - .5) * H / rows * .75;
      row.push([x, y]);
    }
    P.push(row);
  }
  const T = [];
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const a = P[j][i], b = P[j][i + 1], c = P[j + 1][i + 1], d = P[j + 1][i];
    if (hash(i + j * 31) > .5) T.push([a, b, c], [a, c, d]); else T.push([a, b, d], [b, c, d]);
  }
  T.forEach((t, i) => { t.cx = (t[0][0] + t[1][0] + t[2][0]) / 3; t.cy = (t[0][1] + t[1][1] + t[2][1]) / 3; t.h = hash(i * 3.3); });
  return T;
})();
function drawBg(fn, o = {}) {
  ctx.strokeStyle = o.stroke || 'rgba(27,16,51,.3)'; ctx.lineJoin = 'round';
  const v = o.vari ?? 7;
  for (const t of BG) tri(t[0], t[1], t[2], hsl(fn(t.cx, t.cy), (t.h - .5) * v), o.lw ?? 1.6);
}

/* ================================================================
   Texto integrado
   ================================================================ */
const FONT_BODY = '"Nunito", "Trebuchet MS", system-ui, sans-serif';
const FONT_DISP = '"Grandstander", "Comic Sans MS", "Trebuchet MS", sans-serif';
const layoutCache = new Map();
function layout(text, font, maxW) {
  const key = text + '|' + font + '|' + maxW;
  if (layoutCache.has(key)) return layoutCache.get(key);
  ctx.font = font;
  const space = ctx.measureText(' ').width;
  const lines = [[]]; let lw = 0, hl = false;
  for (let raw of text.split(' ')) {
    let wHl = hl;
    if (raw.startsWith('*')) { raw = raw.slice(1); wHl = true; hl = true; }
    if (raw.includes('*')) { raw = raw.replace('*', ''); hl = false; }
    const w = ctx.measureText(raw).width;
    if (lw > 0 && lw + space + w > maxW) { lines.push([]); lw = 0; }
    const line = lines[lines.length - 1];
    line.push({ t: raw, w, x: lw ? lw + space : 0, hl: wHl });
    lw = (lw ? lw + space : 0) + w;
  }
  const L = lines.map(ws => ({ ws, w: ws.length ? ws[ws.length - 1].x + ws[ws.length - 1].w : 0 }));
  const res = { lines: L, maxW: Math.max(...L.map(l => l.w)) };
  layoutCache.set(key, res);
  return res;
}
/* Dibuja palabras que aparecen una a una (desde t=0) */
function words(L, font, size, cx, top, t, o = {}) {
  const wps = o.wps ?? 3.6, lh = size * (o.lh ?? 1.3);
  ctx.font = font; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  let idx = 0;
  L.lines.forEach((line, li) => {
    const x0 = cx - line.w / 2, y = top + size * .95 + li * lh;
    for (const w of line.ws) {
      const a = clamp((t - idx / wps) / .3); idx++;
      if (a <= 0) continue;
      const dy = (1 - easeOut(a)) * 16;
      ctx.save();
      ctx.globalAlpha *= a;
      if (o.stroke) { ctx.lineWidth = o.stroke; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.strokeText(w.t, x0 + w.x, y + dy); }
      ctx.fillStyle = w.hl ? (o.hlColor || '#d6246f') : (o.color || INK);
      ctx.fillText(w.t, x0 + w.x, y + dy);
      ctx.restore();
    }
  });
  return L.lines.length * lh;
}
const panelCache = new Map();
function panelPts(x, y, w, h, seed) {
  const key = [x, y, w, h, seed].map(Math.round).join(',');
  if (panelCache.has(key)) return panelCache.get(key);
  const pts = [], j = (i, s) => (hash(seed * 9.1 + i * 2.3 + s) - .5) * 14;
  const nx = Math.max(2, Math.round(w / 230)), ny = Math.max(1, Math.round(h / 160));
  let i = 0;
  for (let k = 0; k < nx; k++) pts.push([x + w * k / nx + j(i, 1), y + j(i++, 2)]);
  for (let k = 0; k < ny; k++) pts.push([x + w + j(i, 1), y + h * k / ny + j(i++, 2)]);
  for (let k = 0; k < nx; k++) pts.push([x + w - w * k / nx + j(i, 1), y + h + j(i++, 2)]);
  for (let k = 0; k < ny; k++) pts.push([x + j(i, 1), y + h - h * k / ny + j(i++, 2)]);
  panelCache.set(key, pts);
  return pts;
}
/* Panel de narración: papel facetado + palabras que se revelan */
function narr(text, t, dur, o = {}) {
  if (t < 0 || t > dur) return;
  const dimSave = DIM; DIM = 0;
  const size = o.size || 46, pad = o.pad || 34;
  const font = `${o.weight || 800} ${size}px ${o.font || FONT_BODY}`;
  const w = o.w || 1540;
  const L = layout(text, font, w - pad * 2);
  const lh = size * 1.3, h = L.lines.length * lh + pad * 1.6;
  const x = o.x ?? (W - w) / 2, y = o.y ?? 48;
  const inA = easeBack(t / .55), alpha = Math.min(clamp(t / .25), clamp((dur - t) / .45));
  ctx.save();
  ctx.globalAlpha = alpha;
  const cx = x + w / 2, cy = y + h / 2;
  ctx.translate(cx, cy);
  ctx.rotate((o.rot ?? -.006) * (1 + (1 - inA)));
  ctx.scale(.88 + .12 * inA, .88 + .12 * inA);
  ctx.translate(-cx, -cy);
  // sombra dura
  ctx.save(); ctx.translate(8, 10);
  ctx.beginPath(); const sp = panelPts(x, y, w, h, o.seed || 3);
  ctx.moveTo(sp[0][0], sp[0][1]); for (const p of sp) ctx.lineTo(p[0], p[1]);
  ctx.closePath(); ctx.fillStyle = 'rgba(27,16,51,.45)'; ctx.fill();
  ctx.restore();
  facet(panelPts(x, y, w, h, o.seed || 3), o.paper || [44, 92, 92], { lw: 6, contrast: 4, seed: o.seed || 3, ilw: 1.4, iink: 'rgba(27,16,51,.16)' });
  words(L, font, size, cx, y + pad * .8, t - .35, { wps: o.wps, hlColor: o.hlColor });
  ctx.restore();
  DIM = dimSave;
}

/* ================================================================
   Personajes y objetos
   ================================================================ */
const C = {
  boa: [150, 72, 40], boaBand: [78, 85, 52], beast: [30, 96, 56], spot: [18, 70, 26],
  skin: [28, 80, 80], gold: [45, 98, 58], paper: [44, 80, 93], pencil: [22, 85, 50],
  hatFill: [24, 62, 50], ele: [212, 38, 66], eleEar: [338, 55, 76],
};

function drawStars(alpha, t) {
  if (alpha <= 0) return;
  const d = DIM; DIM = 0;
  ctx.save(); ctx.globalAlpha = alpha;
  for (let i = 0; i < 70; i++) {
    const x = hash(i * 3.1) * W, y = hash(i * 7.7) * H * .62, s = (3 + hash(i) * 7) * (.6 + .4 * Math.sin(t * 2 + i));
    ctx.beginPath(); ctx.moveTo(x, y - s * 2); ctx.lineTo(x + s * .6, y); ctx.lineTo(x, y + s * 2); ctx.lineTo(x - s * .6, y); ctx.closePath();
    ctx.fillStyle = i % 5 ? '#fff6c8' : '#ffd23f'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - s * 1.6, y); ctx.lineTo(x, y + s * .5); ctx.lineTo(x + s * 1.6, y); ctx.lineTo(x, y - s * .5); ctx.closePath(); ctx.fill();
  }
  ctx.restore(); DIM = d;
}
function drawSun(x, y, r, t) {
  const d = DIM; DIM = 0;
  ctx.save(); ctx.translate(x, y); ctx.rotate(t * .3);
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2, b = a + .14, c = a - .14, R = r * (i % 2 ? 1.55 : 1.8);
    ctx.strokeStyle = INK;
    tri([Math.cos(b) * r * .9, Math.sin(b) * r * .9], [Math.cos(a) * R, Math.sin(a) * R], [Math.cos(c) * r * .9, Math.sin(c) * r * .9], hsl([38 + i % 2 * 10, 100, 58]), 4);
  }
  ctx.restore();
  facet(blob(x, y, r, r, 12, 4, .04, t * .3), [48, 100, 60], { lw: 5, contrast: 8, seed: 4 });
  DIM = d;
}
function drawMoon(x, y, r) {
  const d = DIM; DIM = 0;
  facet(blob(x, y, r, r, 12, 8, .05), [52, 70, 86], { lw: 5, contrast: 6, seed: 8 });
  facet(blob(x - r * .3, y - r * .2, r * .22, r * .2, 6, 2), [52, 40, 74], { lw: 3, simple: true });
  facet(blob(x + r * .3, y + r * .3, r * .16, r * .15, 6, 3), [52, 40, 74], { lw: 3, simple: true });
  DIM = d;
}

/* El niño / el principito. Pies en (x,y) */
function drawKid(x, y, s, t, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (o.flip) ctx.scale(-1, 1);
  const coat = o.coat || [140, 70, 42], hair = o.hair || [48, 96, 58];
  if (o.scarf) {
    const sp = [];
    for (let i = 0; i <= 9; i++) sp.push([6 + i * 16, -110 + Math.sin(t * 6 - i * .9) * i * 1.6 - i * 2]);
    const r = ribbon(sp, k => 20 - k * 12);
    strip(r.top, r.bot, [46, 98, 56], { rows: 1, lw: 4, seed: 5 });
  }
  facet(rectP(-18, -44, 13, 44), [232, 45, 32], { lw: 4, simple: true });
  facet(rectP(5, -44, 13, 44), [232, 45, 32], { lw: 4, simple: true, seed: 3 });
  facet([[-42, -30], [42, -30], [24, -114], [-24, -114]], coat, { lw: 5, seed: 3 });
  if (o.wave !== undefined) {
    const a = -1.0 + Math.sin(t * 6) * .4 * o.wave, sx = 22, sy = -100;
    const ex = sx + Math.cos(a) * 55, ey = sy + Math.sin(a) * 55;
    const r = ribbon([[sx, sy], [(sx + ex) / 2, (sy + ey) / 2], [ex, ey]], () => 15);
    strip(r.top, r.bot, coat, { rows: 1, lw: 4 });
    facet(blob(ex, ey, 10, 10, 6, 2), C.skin, { lw: 3, simple: true });
  }
  facet(blob(0, -144, 33, 33, 10, 7, .05), C.skin, { lw: 5, seed: 5, contrast: 6, iink: 'rgba(27,16,51,.28)' });
  const hp = [];
  for (let i = 0; i <= 10; i++) {
    const a = Math.PI + i / 10 * Math.PI, r = i % 2 ? 50 : 36;
    hp.push([Math.cos(a) * r, -150 + Math.sin(a) * r * .85]);
  }
  hp.push([24, -146], [-24, -146]);
  facet(hp, hair, { lw: 5, seed: 6, contrast: 10 });

/* ---------- Dibujo número 1 (sombrero / boa) ---------- */
const PX = 460, PB = 840, HAT_N = 72;
const hatH = u => 30 * Math.pow(Math.sin(Math.PI * u), .5) + 230 * Math.exp(-Math.pow((u - .5) / .22, 2));
const HAT = (() => {
  const top = [], bot = [];
  for (let i = 0; i <= HAT_N; i++) { const u = i / HAT_N; top.push([PX + u * 1000, PB - hatH(u)]); bot.push([PX + u * 1000, PB]); }
  const path = [...top, ...bot.slice().reverse()];
  const ftop = top.filter((_, i) => i % 3 === 0), fbot = bot.filter((_, i) => i % 3 === 0);
  const cum = [0];
  for (let i = 1; i < path.length; i++) cum.push(cum[i - 1] + Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]));
  return { top, bot, ftop, fbot, path, cum, len: cum[cum.length - 1] };
})();
const E = (u, h) => [PX + u * 1000, PB - h];

function drawPartial(path, cum, f, col, lw) {
  const target = f * cum[cum.length - 1];
  ctx.beginPath(); ctx.moveTo(path[0][0], path[0][1]);
  let tip = path[0];
  for (let i = 1; i < path.length; i++) {
    if (cum[i] <= target) { ctx.lineTo(path[i][0], path[i][1]); tip = path[i]; }
    else {
      const k = (target - cum[i - 1]) / (cum[i] - cum[i - 1]);
      tip = [lerp(path[i - 1][0], path[i][0], k), lerp(path[i - 1][1], path[i][1], k)];
      ctx.lineTo(tip[0], tip[1]); break;
    }
  }
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.lineCap = 'butt';
  return tip;
}
function drawHatFill(col, o = {}) {
  strip(HAT.ftop, HAT.fbot, col, {
    rows: 3, lw: o.lw ?? 7, seed: 12, contrast: 10,
    colFn: o.band ? (i => (Math.floor(i / 2) % 2 && i > 0 && i < HAT_N / 3 - 1 ? mixc(col, o.band, o.bandAmt ?? 1) : col)) : null,
  });
}

  { kind: 'leg', p: rectP(...E(.415, 72), 34, 72) },

  { kind: 'leg', p: rectP(...E(.575, 72), 34, 72) },

  { kind: 'trunk', spine: [E(.335, 104), E(.315, 80), E(.302, 52), E(.296, 26), E(.305, 12)] },
  { kind: 'head', p: blob(...E(.365, 118), 52, 50, 10, 33, .04) },
  { kind: 'ear', p: blob(...E(.405, 116), 36, 46, 8, 34, .06) },

function drawElephant(reveal, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha;
  ELE_PARTS.forEach((part, i) => {
    const a = reveal === undefined ? 1 : clamp((reveal - i / ELE_PARTS.length) * ELE_PARTS.length);
    if (a <= 0) return;
    const pts = part.p;
    let cx = 0, cy = 0;
    if (pts) { for (const p of pts) { cx += p[0]; cy += p[1]; } cx /= pts.length; cy /= pts.length; }
    else if (part.spine) { cx = part.spine[1][0]; cy = part.spine[1][1]; }
    else { cx = part.c[0]; cy = part.c[1]; }
    const s = easeBack(a);
    ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);

      const r = ribbon(part.spine, k => part.kind === 'trunk' ? 28 - k * 14 : 9 - k * 4);
      strip(r.top, r.bot, C.ele, { rows: part.kind === 'trunk' ? 2 : 1, lw: 5, seed: i });
    } else if (part.kind === 'eye') {
      dot(cx, cy, 6, INK);

    } else {
      facet(pts, part.kind === 'ear' ? C.eleEar : C.ele, { lw: 5, seed: i + 30, contrast: 10, simple: part.kind === 'leg' });
    }
    ctx.restore();
  });
  ctx.restore();
}

let acc = 0;
for (const s of SCENES) { s.start = acc; acc += s.dur; }
const TOTAL = acc;

/* Transición: barrido de triángulos de tinta */
const TT = .55;
function transition(T) {
  for (let i = 1; i < SCENES.length; i++) {
    const u = T - SCENES[i].start;
    if (Math.abs(u) >= TT) continue;
    for (const tr of BG) {
      const th = (tr.cx / W) * .6 + tr.h * .4;
      const a = u < 0 ? clamp(((u + TT) / TT - th) * 5) : 1 - clamp((u / TT - th) * 5);
      if (a <= 0) continue;
      ctx.save(); ctx.globalAlpha = a;
      ctx.strokeStyle = 'rgba(255,201,60,.35)';
      tri(tr[0], tr[1], tr[2], hsl([255 + tr.h * 30, 50, 12 + tr.h * 9]), 1.5);
      ctx.restore();
    }
  }
}

/* ================================================================
   Bucle, tamaño y controles
   ================================================================ */
let scale = 1, ox = 0, oy = 0;
function resize() {
  const r = cv.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(1, Math.round(r.width * d)); cv.height = Math.max(1, Math.round(r.height * d));
  scale = Math.min(cv.width / W, cv.height / H);
  ox = (cv.width - W * scale) / 2; oy = (cv.height - H * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

function render(T) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#120a26'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  let i = SCENES.length - 1;
  while (i > 0 && T < SCENES[i].start) i--;
  DIM = 0;
  SCENES[i].draw(T - SCENES[i].start);
  DIM = 0;
  transition(T);
  ctx.restore();
}

const playBtn = document.getElementById('play'), playIcon = document.getElementById('playIcon');
const seek = document.getElementById('seek'), timeEl = document.getElementById('time'), hud = document.getElementById('hud');
let T = 0, playing = true, last = performance.now(), ready = false;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function setPlaying(p) {
  playing = p;
  if (playing && T >= TOTAL) T = 0;
  playIcon.setAttribute('d', playing ? 'M5 3h4v14H5zM11 3h4v14h-4z' : 'M5 3l12 7-12 7z');
  playBtn.setAttribute('aria-label', playing ? 'Pausar' : 'Reproducir');
  poke();
}
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (ready) {
    if (playing) { T += dt; if (T >= TOTAL) { T = TOTAL; setPlaying(false); } }
    render(Math.min(T, TOTAL - 1e-3));
    seek.value = Math.round(T / TOTAL * 1000);
    timeEl.textContent = `${fmt(T)} / ${fmt(TOTAL)}`;
  }
  requestAnimationFrame(frame);
}
playBtn.addEventListener('click', () => setPlaying(!playing));
document.getElementById('restart').addEventListener('click', () => { T = 0; setPlaying(true); });
seek.addEventListener('input', () => { T = seek.value / 1000 * TOTAL; poke(); });
cv.addEventListener('click', () => setPlaying(!playing));
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'ArrowRight') { T = Math.min(TOTAL, T + 5); poke(); }
  else if (e.key === 'ArrowLeft') { T = Math.max(0, T - 5); poke(); }
  else if (e.key === 'r' || e.key === 'R') { T = 0; setPlaying(true); }
});
let idleTimer;
function poke() {
  hud.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (playing) hud.classList.add('idle'); }, 2600);
}
window.addEventListener('pointermove', poke);
window.addEventListener('pointerdown', poke);

window.__seek = s => { T = s; playing = false; render(Math.min(T, TOTAL - 1e-3)); };
window.__total = TOTAL;

const fontsReady = Promise.all([
  document.fonts.load(`900 100px "Grandstander"`),
  document.fonts.load(`800 40px "Nunito"`),
]).catch(() => {});
Promise.race([fontsReady, new Promise(r => setTimeout(r, 2500))]).then(() => {
  layoutCache.clear();
  ready = true; last = performance.now(); poke();
});
requestAnimationFrame(frame);
})();
</script>
